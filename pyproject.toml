[project]
name = "grok-cue"
version = "0.2.1"
description = "Signed, accept-only handoff receiver that forwards Cue task notices to Grok Bot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "httpx2==2.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
